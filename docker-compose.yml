version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: quality-agent-postgres
    environment:
      POSTGRES_DB: quality_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quality-agent-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: quality-agent-api
    environment:
      POSTGRES_DB: quality_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quality-agent-network
    volumes:
      - ./api:/app

volumes:
  postgres_data:

networks:
  quality-agent-network:
    driver: bridge
